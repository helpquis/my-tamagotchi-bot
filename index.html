<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мой Тамагочи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, это будущий Тамагочи! 🐣</h1>
        <p>Здесь скоро появится твой питомец.</p>
        <p>А пока это просто тестовая страница.</p>
    </div>
    <script>
        // Сообщаем Telegram, что страница загрузилась
        window.Telegram.WebApp.ready();
        // Разворачиваем на весь экран
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
